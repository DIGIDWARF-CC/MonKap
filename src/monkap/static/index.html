<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonKap</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/monkap.css">
</head>
<body>
<div class="mk" id="mk">
  <nav class="mk-rail" id="mkRail" aria-label="Modes">
    <button type="button" id="mkRailMain" class="on" aria-label="Workbench" title="Workbench"><svg viewBox="0 0 24 24"><path d="M7 3v13a2 2 0 0 0 2 2h12"/><path d="M3 7h13a2 2 0 0 1 2 2v12"/></svg></button>
    <button type="button" id="mkRailLab" aria-label="Enhance lab" title="Enhance lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4A1.5 1.5 0 0 0 19.5 19L14 9V3"/><path d="M7.5 15h9"/></svg></button>
  </nav>
  <div class="mk-main">
    <div class="mk-multitop" id="mkMultiTop">
      <button class="btn btn-sm" id="mkBackGal" type="button" title="Back to the gallery of the selected pictures"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back to selection gallery</button>
      <span class="mk-multitext" id="mkMultiText"></span>
      <button class="btn btn-sm" id="mkUndoCaps" type="button" style="display:none">Undo captions</button>
      <button class="btn btn-sm" id="mkExitSel" type="button" title="Leave selection mode">Exit selection mode</button>
    </div>
    <div class="mk-gallery" id="mkGallery" tabindex="0" aria-label="The selected pictures"></div>
    <div class="mk-stage" id="mkStage" tabindex="0" aria-label="The picture">
      <canvas id="mkCanvas"></canvas>
      <div class="mk-ratios" id="mkRatios" role="group" aria-label="Frame ratio"></div>
      <button class="mk-i" id="mkInfo" title="About this picture" aria-label="About this picture">i</button>
      <button class="btn btn-primary mk-kap" id="mkKapture" title="Save the frame as a new picture (C)">Kapture <kbd>C</kbd></button>
      <div class="mk-zoom" id="mkZoom">
        <button class="mk-zb" id="mkZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="mk-zb mk-pct" id="mkActual" title="Zoom. Click for one picture pixel per screen pixel">100%</button>
        <button class="mk-zb" id="mkZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="mk-zb" id="mkFit" title="Fit the whole picture">Fit</button>
      </div>
      <div class="mk-mode" id="mkMode">Frame: <kbd>C</kbd> saves it as a new picture · <kbd>Esc</kbd> drops it</div>
      <div class="mk-msg" id="mkMsg"></div>
      <div class="mk-enhov" id="mkEnhOv" hidden>
        <img class="bg" id="mkEnhBg" alt="">
        <div class="box">
          <div class="what" id="mkEnhWhat">Starting…</div>
          <div class="mk-enh-bar wait" id="mkEnhBar"><i></i></div>
          <div class="mk-enh-line" id="mkEnhLine"></div>
        </div>
      </div>
      <div class="mk-diff" id="mkDiff" hidden>
        <div class="fit" id="mkDiffFit">
          <img class="o" id="mkDiffO" alt="Original" draggable="false">
          <img class="e" id="mkDiffE" alt="Enhanced" draggable="false">
          <div class="cut" id="mkDiffCut" role="slider" tabindex="0" aria-label="Divider between the original (left) and the enhanced picture (right)" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        </div>
      </div>
    </div>
    <div class="mk-caption">
      <div class="mk-capbox">
        <textarea id="mkText" spellcheck="false" placeholder="Caption (saved by itself when you move on)"></textarea>
        <span class="mk-badge" id="mkBadge" style="display:none"></span>
      </div>
      <div class="field-hint mk-status" id="mkStatus"></div>
      <div class="mk-verdict" id="mkVerdict" style="display:none"></div>
    </div>
    <div class="mk-actions">
      <button class="btn" id="mkPrev" title="Previous picture (PgUp)"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Prev</span><kbd>PgUp</kbd></button>
      <button class="btn" id="mkNext" title="Next picture (PgDn)"><span class="lbl">Next</span><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg><kbd>PgDn</kbd></button>
      <button class="btn" id="mkTrigger" title="Put the trigger word first in the caption" style="display:none"><svg class="ico" viewBox="0 0 24 24"><circle cx="10" cy="12" r="7.5"/><path d="M2.5 12h15M10 4.5c2.2 2.2 3.2 4.7 3.2 7.5s-1 5.3-3.2 7.5c-2.2-2.2-3.2-4.7-3.2-7.5S7.8 6.7 10 4.5z"/><path d="M20.5 7v10M18.8 7h3.4M18.8 17h3.4"/></svg><span class="lbl">Trigger word</span></button>
      <div class="mk-split" id="mkSplit">
        <button class="btn" id="mkRegen"
        title="Write this picture's caption again with the model and task from the settings: the old text is replaced (it is kept, and Undo brings it back)"><svg class="ico" viewBox="0 0 24 24"><path d="M9.5 4.5A3 3 0 0 0 6.6 7 3.2 3.2 0 0 0 4.5 12a3.2 3.2 0 0 0 2 4.8A3 3 0 0 0 9.5 19.5a2.5 2.5 0 0 0 2.5-1.8V6.3a2.5 2.5 0 0 0-2.5-1.8z"/><path d="M14.5 4.5A3 3 0 0 1 17.4 7a3.2 3.2 0 0 1 2.1 5 3.2 3.2 0 0 1-2 4.8 3 3 0 0 1-3 2.7 2.5 2.5 0 0 1-2.5-1.8V6.3a2.5 2.5 0 0 1 2.5-1.8z"/><path d="M9.5 9.5c1 0 2.5.5 2.5 2M14.5 9.5c-1 0-2.5.5-2.5 2M9.5 15c1 0 2.5-.6 2.5-2M14.5 15c-1 0-2.5-.6-2.5-2"/></svg><span class="lbl">AI ReCaption</span></button>
        <button class="btn mk-chev" id="mkHintBtn" type="button" title="ReCaption with a hint for the model" aria-label="ReCaption with a hint" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      </div>
      <div class="mk-split" id="mkEnhSplit">
        <button class="btn" id="mkEnhance"
        title="Make this picture sharper and cleaner with ComfyUI (set up in the settings, Enhance tab)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg><span class="lbl">AI enhance</span></button>
        <button class="btn mk-chev" id="mkEnhHintBtn" type="button" title="Enhance with your own words for this picture" aria-label="Enhance with a hint" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      </div>
      <button class="btn btn-danger" id="mkDelete" title="Delete this picture (Shift+Delete)"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg><span class="lbl">Delete…</span><kbd>⇧</kbd><kbd>Del</kbd></button>
    </div>
    <div class="mk-actions" id="mkEnhActions" hidden></div>
  </div>
  <aside class="mk-side">
    <div class="mk-title">
      <h1>MonKap</h1>
      <button class="mk-q" id="mkHelp" title="What is MonKap, and how to use it" aria-label="Help">?</button>
      <button class="mk-q" id="mkSettings" title="Names of the new pictures, captions, delete mode" aria-label="Settings">⚙</button>
    </div>
    <a href="#" class="mk-change" id="mkChange">Change folder…</a>
    <div class="mk-review" id="mkReview" style="display:none">
      <select id="mkShow" title="Which pictures to list"><option value="all">All pictures</option></select>
      <select id="mkSort" title="The order of the list">
        <option value="name">By name</option><option value="date">Caption changed (newest first)</option><option value="hard">Hardest first</option><option value="verdict">By verdict</option>
      </select>
      <a href="#" id="mkLegend" class="mk-change">What do the icons and labels mean?</a>
    </div>
    <button class="mk-nodata" id="mkNoData" type="button" style="display:none" title="Why there are no training verdicts for this folder"><span class="bang">!</span>No training data</button>
    <div class="mk-rnote" id="mkReviewNote" style="display:none"></div>
    <button class="btn btn-sm mk-selenter" id="mkSelEnter" type="button" title="Pick several pictures to caption or delete them together">Enter selection mode</button>
    <div class="mk-selbar" id="mkSelBar">
      <button class="mk-ib" id="mkSelAll" type="button" title="Select all (Ctrl+A)" aria-label="Select all"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.5l3 3 5-6"/></svg></button>
      <button class="mk-ib" id="mkSelNone" type="button" title="Select none" aria-label="Select none"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg></button>
      <button class="mk-ib" id="mkSelInv" type="button" title="Invert the selection" aria-label="Invert the selection"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 3.5v17M12 3.5h5.5a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H12z" fill="currentColor" stroke="none" opacity=".55"/></svg></button>
      <span class="mk-selcount" id="mkSelCount">0 selected</span>
    </div>
    <button class="btn btn-sm mk-drawer" id="mkDrawer" aria-expanded="false">Pictures ▾</button>
    <div class="mk-strip" id="mkStrip" aria-label="Pictures in the folder"><div class="mk-strip-in" id="mkStripIn"></div></div>
  </aside>
</div>
<script src="/lib.js"></script>
<script src="/monkap_geo.js"></script>
<script src="/monkap_lab.js"></script>
<script src="/monkap.js"></script>
</body>
</html>
