[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monkap"
dynamic = ["version"]
description = "A workbench for preparing image datasets: frame and crop pictures, write and edit captions by hand or with a model, and review the whole set from the keyboard."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
window = ["pywebview>=5"]

[project.scripts]
monkap = "monkap.__main__:main"

[project.gui-scripts]
monkap-gui = "monkap.gui:main"

[tool.setuptools.dynamic]
version = { attr = "monkap.__version__" }      # the one place the version lives: src/monkap/__init__.py (packaging/build.py --bump)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monkap = ["static/*", "ai/templates/*.json"]
